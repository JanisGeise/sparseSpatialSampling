[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-spatial-sampling"
dynamic = ["version"]
description = "Sparse Spatial Sampling library"
authors = [{ name = "Sparse Spatial Sampling contributors" }]
requires-python = ">=3.9"

[tool.setuptools.dynamic]
version = { attr = "sparseSpatialSampling.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["sparseSpatialSampling*"]

